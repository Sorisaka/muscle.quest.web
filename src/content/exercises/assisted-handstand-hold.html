<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倒立維持（補助あり）のやり方</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 2rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>倒立維持（補助あり）</h1>
    <p>壁補助を使って倒立姿勢を保持する種目。</p>
    <ol>
      <li>開始前に姿勢と呼吸を整え、狙う筋群を意識します。</li>
      <li>反動を使わず、各セットでフォームを一定に保って実施します。</li>
      <li>終了後に回数・時間・重量を記録し、次回の調整に活かします。</li>
    </ol>
    <p>注意: 姿勢が崩れたら中断し、無理のない範囲で実施してください。</p>
  </body>
</html>
