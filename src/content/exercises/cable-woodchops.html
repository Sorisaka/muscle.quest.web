  <head>

    <title>ケーブルウッドチョップのやり方</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 2rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>ケーブルウッドチョップ</h1>
    <p>回旋動作で体幹を鍛えるケーブル種目。</p>
    <ol>
      <li>開始前に姿勢と呼吸を整え、狙う筋群を意識します。</li>
      <li>反動を使わず、各セットでフォームを一定に保って実施します。</li>
      <li>終了後に回数・時間・重量を記録し、次回の調整に活かします。</li>
    </ol>
    <p>注意: 高負荷種目は補助者や安全装置を利用し、痛みがある場合は中止してください。</p>
  </body>
</html>
