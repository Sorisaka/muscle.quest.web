  <head>

    <title>サッカーのやり方</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 2rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>サッカー</h1>
    <ol>
      <li>開始前に姿勢と呼吸を整え、使う部位を意識します。</li>
      <li>可動域を一定に保ち、反動を使わずにゆっくり実施します。</li>
      <li>終了後は呼吸を整えて、対象部位を軽くストレッチします。</li>
    </ol>
    <p>注意: フォームが崩れると関節に負担がかかるため、痛みがある場合は中止してください。</p>
  </body>
